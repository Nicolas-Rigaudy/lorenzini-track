[project]
name = "poseidon-backend"
version = "0.1.0"
description = "API and data pipeline for the poseidon marine wildlife/telemetry explorer (codename, user-facing name TBD)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
# backend/alembic/ holds migrations; the `alembic` import is the installed package.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection is declared through argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
