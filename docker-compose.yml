name: lorenzini-track

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: lorenzini
      POSTGRES_PASSWORD: lorenzini
      POSTGRES_DB: lorenzini_track
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lorenzini -d lorenzini_track"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Disposable database for the backend tests: data lives in tmpfs and the container is
  # removed after each run (see backend/scripts/test.sh). Not started by a plain `up`.
  db-test:
    image: postgis/postgis:16-3.4
    profiles: ["test"]
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://lorenzini:lorenzini@db:5432/lorenzini_track
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
