name: Pages

# Manual only. Nothing publishes on push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start PostGIS and Mosquitto
        run: docker compose up --detach --wait db mqtt

      - name: Fill the database and export it
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://lorenzini:lorenzini@localhost:5432/lorenzini_track
        run: |
          pip install -e .
          python -m app.pipeline --seed 42
          for reader in app/ingestion/gbif_*.py; do
            python -m "app.ingestion.$(basename "$reader" .py)"
          done
          python -m app.export --out ../frontend/public/data

      - name: Build the static site
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          VITE_BASE: /lorenzini-track/
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
