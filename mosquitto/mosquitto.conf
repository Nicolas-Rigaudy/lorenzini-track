# Local broker for the simulated receivers (decision 0009). Development only: anonymous
# clients on the plain listener, no persistence beyond the container.
listener 1883
allow_anonymous true
persistence false
log_dest stdout
# The replay publishes a season of receiver messages in seconds; the default queue of 1000
# QoS 1 messages per client would drop most of them before the gateway reads them.
max_queued_messages 0
